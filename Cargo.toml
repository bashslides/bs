[package]
name = "bs"
version = "0.1.0"
edition = "2024"

[features]
default = ["tui"]
# The terminal UI (editor + player). Off for the wasm build, which needs only
# the engine and cannot compile crossterm.
tui = ["dep:crossterm", "dep:libc"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossterm = { version = "0.28", optional = true }
anyhow = "1"

[target.'cfg(unix)'.dependencies]
# kill/waitid for the player's Command process groups (already pulled in by crossterm).
libc = { version = "0.2", optional = true }

[dev-dependencies]
serde_json = "1"

# The `bs` binary is the terminal CLI; `--no-default-features` builds the engine
# as a library only (what `wasm/` links against).
[[bin]]
name = "bs"
path = "src/main.rs"
required-features = ["tui"]

[workspace]
members = ["wasm"]
resolver = "3"

# Size-tuned profile for the WebAssembly build only, so the CLI's own release
# profile keeps its normal speed-oriented settings.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
