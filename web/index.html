<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bs — presentation viewer</title>
<meta name="description" content="Renders a compiled bs presentation in the browser.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23000'/%3E%3Ctext x='2' y='12' font-family='monospace' font-size='11' fill='%23e0e0e0'%3Ebs%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header id="bar">
      <span class="brand">bs</span>
      <span class="dim">/</span>
      <button id="open" type="button" title="Open a compiled presentation (o)"><span id="deck-name">no deck</span></button>
      <span class="grow"></span>
      <span id="note" class="dim"></span>
      <span id="counter" class="dim">--/--</span>
    </header>

    <main id="stage">
      <pre id="screen" class="metrics"></pre>
    </main>

    <footer id="foot">
      <div id="framebar" aria-hidden="true"></div>
      <div id="hint" class="dim">
        <b>←</b>/<b>→</b> step &nbsp;·&nbsp; <b>shift</b>+<b>←</b>/<b>→</b> ±10 &nbsp;·&nbsp;
        <b>home</b>/<b>end</b> &nbsp;·&nbsp; <b>f</b> fullscreen &nbsp;·&nbsp; <b>o</b> open
      </div>
    </footer>
  </div>

  <pre id="probe" class="metrics" aria-hidden="true"></pre>
  <div id="drop"><span>drop a compiled presentation</span></div>
  <input id="file" type="file" accept=".json,application/json" hidden>

  <script src="app.js"></script>
</body>
</html>
