<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>bs — present</title>
<meta name="description" content="Renders a compiled bs presentation in the browser.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23000'/%3E%3Ctext x='2' y='12' font-family='monospace' font-size='11' fill='%23e0e0e0'%3Ebs%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header id="bar">
      <a class="brand" href="./">bs</a>
      <span class="dim">/</span>
      <span>present</span>
      <span class="dim">/</span>
      <span id="deck-name" class="ellipsis dim">no deck</span>
      <span class="grow"></span>
      <span id="note" class="dim ellipsis"></span>
    </header>

    <main id="stage">
      <canvas id="screen" role="img" aria-label="presentation canvas"></canvas>
      <pre id="msg" class="metrics" hidden></pre>
    </main>

    <footer id="foot">
      <div id="framebar" aria-hidden="true"></div>
      <!-- Every control here is a real button: on a phone there is no keyboard,
           so anything that is only a key hint is unreachable. -->
      <div id="controls">
        <button id="btn-prev"  type="button" title="previous frame (←)" aria-label="previous frame">←</button>
        <button id="btn-next"  type="button" title="next frame (→)" aria-label="next frame">→</button>
        <button id="btn-first" type="button" title="first frame (home)" aria-label="first frame">⇤</button>
        <button id="btn-last"  type="button" title="last frame (end)" aria-label="last frame">⇥</button>
        <button id="btn-open"  type="button" title="open a compiled deck (o)">open</button>
        <button id="btn-full"  type="button" title="fullscreen (f)">full</button>
        <span id="counter" class="dim">--/--</span>
      </div>
    </footer>
  </div>

  <button id="exit-full" type="button" title="leave fullscreen (esc)">✕ full</button>
  <div id="drop"><span>drop a compiled presentation</span></div>
  <input id="file" type="file" accept=".json,application/json" hidden>

  <script src="app.js"></script>
</body>
</html>
