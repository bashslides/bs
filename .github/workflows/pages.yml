# Publishes the static web viewer in `web/` to GitHub Pages.
#
# The `enablement: true` input below creates the Pages site over the API on the
# first run, so no Settings → Pages click is needed. If you prefer to set it by
# hand: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# No build step is needed — `web/` is plain static HTML/CSS/JS, uploaded as-is.
name: Deploy web viewer

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let one deployment finish before the next starts; never cancel a live deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
        with:
          # Create the Pages site over the API if it does not exist yet, so the
          # first deploy does not depend on the Settings → Pages UI having been
          # saved. Needs the `pages: write` permission declared above.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
